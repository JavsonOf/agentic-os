name: android

on:
  push:
    branches: [main]  # a merge with a real change (see CHANGELOG.md) gets its own release
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write  # publish the APK as a GitHub release on main

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags and history for the release notes
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build APK
        run: gradle -p android --no-daemon assembleRelease testReleaseUnitTest
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk AgenticOS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AgenticOS-apk
          path: AgenticOS.apk
      - name: Release notes
        id: notes
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          previous=$(git tag --list 'android-*' --sort=-v:refname | head -n 1)
          python3 scripts/release_notes.py --since "$previous" > release-notes.md
          cat release-notes.md
          # A release only for real changes (or a new app build); "Drobne zmiany" wait for the next one.
          worth=$(python3 scripts/release_notes.py --worth-release "$previous")
          if [ -z "$previous" ] || ! git diff --quiet "$previous" HEAD -- android; then worth=yes; fi
          echo "publish=$worth" >> "$GITHUB_OUTPUT"
          echo "Publish a release: $worth"
      - name: Publish release
        if: steps.notes.outputs.publish == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Agentic OS – wydanie ${{ github.run_number }} · Release ${{ github.run_number }}
          make_latest: true
          files: AgenticOS.apk
          body_path: release-notes.md  # what changed, from CHANGELOG.md
