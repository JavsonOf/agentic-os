name: android

on:
  push:
    branches: [main]  # a merge with a real change (see CHANGELOG.md) gets its own release
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write  # publish the APK as a GitHub release on main

# Releases are numbered one after another, so two merges must not compute the same version at once.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('apk-{0}', github.ref) || 'releases' }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags and history for the release notes
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Release version, title and notes
        id: notes
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          # SemVer from CHANGELOG.md: vX.Y.Z — Obszar: opis (see "Wersje i nazwy wydań" there)
          previous=$(git tag --list 'v*' 'android-*' --sort=-creatordate | head -n 1)
          version=$(python3 scripts/release_notes.py --next-version "$previous")
          title=$(python3 scripts/release_notes.py --next-title "$previous")
          python3 scripts/release_notes.py --since "$previous" > release-notes.md
          # A release only for real changes (or a new app build); "Drobne zmiany" wait for the next one.
          worth=$(python3 scripts/release_notes.py --worth-release "$previous")
          if [ -z "$previous" ] || ! git diff --quiet "$previous" HEAD -- android; then worth=yes; fi
          {
            echo "publish=$worth"
            echo "version=$version"
            echo "name=$version — $title"
          } >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=${version#v}" >> "$GITHUB_ENV"
          echo "Previous: ${previous:-none} · next: $version — $title · publish: $worth"
          cat release-notes.md
      - name: Build APK
        run: gradle -p android --no-daemon assembleRelease testReleaseUnitTest
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk AgenticOS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AgenticOS-apk
          path: AgenticOS.apk
      - name: Publish release
        if: steps.notes.outputs.publish == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.version }}
          name: ${{ steps.notes.outputs.name }}
          make_latest: true
          files: AgenticOS.apk
          body_path: release-notes.md  # what changed, from CHANGELOG.md
