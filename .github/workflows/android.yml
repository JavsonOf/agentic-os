name: android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write  # publish the APK as a GitHub release on main

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build APK
        run: gradle -p android --no-daemon assembleRelease
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk AgenticOS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AgenticOS-apk
          path: AgenticOS.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Agentic OS for Android (build ${{ github.run_number }})
          make_latest: true
          files: AgenticOS.apk
          body: |
            Install on Android: open this page on your phone, tap **AgenticOS.apk**, then allow installing
            from your browser when asked. Updates install over the previous version.
