name: android

on:
  push:
    branches: [main]  # a merge with a real change (see CHANGELOG.md) gets its own release
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write  # publish the APK as a GitHub release on main

# Releases are numbered one after another, so two merges must not compute the same version at once.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('apk-{0}', github.ref) || 'releases' }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags and history for the release notes
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Release version, title and notes
        id: notes
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          # SemVer from CHANGELOG.md: vX.Y.Z – English title (see "Wersje i nazwy wydań" there)
          # Test builds (v0.3.0-beta.1) collect the changes since the last stable release, like the release itself.
          previous=$(git tag --list 'v*' 'android-*' --sort=-creatordate | head -n 1)
          stable=$(git tag --list 'v*' 'android-*' --sort=-creatordate | grep -v -- '^v.*-' | head -n 1 || true)
          version=$(python3 scripts/release_notes.py --next-version "$stable")
          title=$(python3 scripts/release_notes.py --next-title "$stable")
          python3 scripts/release_notes.py --since "$stable" > release-notes.md
          # A release only for real changes (or a new app build); "Drobne zmiany" wait for the next one.
          worth=$(python3 scripts/release_notes.py --worth-release "$previous")
          # A new app build means changed app code; docs such as android/README.md do not count.
          if [ -z "$previous" ] || ! git diff --quiet "$previous" HEAD -- android ':(exclude)android/*.md'; then worth=yes; fi
          # "Wersja: build" always publishes its rebuild (v0.2.6+build.1).
          if [[ "$version" == *+* ]]; then worth=yes; fi
          # Dropping "Wersja: beta" after test builds publishes the stable release.
          if [[ "$previous" == *-* && "$version" != *-* ]]; then worth=yes; fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          {
            echo "publish=$worth"
            echo "version=$version"
            echo "name=$version – $title"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=${version#v}" >> "$GITHUB_ENV"
          echo "APK_NAME=$(python3 scripts/release_notes.py --apk-name "$version")" >> "$GITHUB_ENV"
          echo "Previous: ${previous:-none} (stable: ${stable:-none}) · next: $version – $title · publish: $worth"
          cat release-notes.md
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PUBLISH: ${{ steps.notes.outputs.publish }}
        run: |
          # The private key lives only in repository secrets (android/keys/README.md). Pull requests and
          # runs without it build with the debug key; a release must never ship with that key.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          elif [ "$PUBLISH" = "yes" ]; then
            echo "::error::Brak sekretu ANDROID_KEYSTORE_BASE64, więc nie da się podpisać wydania. Utwórz klucz: android/keys/README.md"
            exit 1
          else
            echo "No signing key in secrets: building with the debug key (not for release)."
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android --no-daemon assembleRelease testReleaseUnitTest
      - name: Rename APK
        run: |
          # AgenticOS_vX.Y.Z.apk on main, AgenticOS.apk for PR builds (no version yet)
          echo "APK_NAME=${APK_NAME:-AgenticOS.apk}" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk "${APK_NAME:-AgenticOS.apk}"
      - uses: actions/upload-artifact@v4
        with:
          name: AgenticOS-apk
          path: ${{ env.APK_NAME }}
      - name: Publish release
        if: steps.notes.outputs.publish == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.version }}
          name: ${{ steps.notes.outputs.name }}
          prerelease: ${{ steps.notes.outputs.prerelease == 'true' }}  # test builds never become "latest"
          make_latest: ${{ steps.notes.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: ${{ env.APK_NAME }}
          body_path: release-notes.md  # what changed, from CHANGELOG.md
