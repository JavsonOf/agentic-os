name: release-notes

# Keeps GitHub releases in line with CHANGELOG.md: releases published before SemVer move to their
# vX.Y.Z tag ("dawniej android-N" lines), APKs are named AgenticOS_vX.Y.Z.apk, and every release gets its
# title and notes from its section.
on:
  push:
    branches: [main]
    paths: ["CHANGELOG.md", "scripts/release_notes.py", ".github/workflows/release-notes.yml"]
  workflow_dispatch:

permissions:
  contents: write  # rename tags and edit release titles and notes

concurrency:
  group: releases
  cancel-in-progress: false

jobs:
  notes:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move old releases to their SemVer tags
        run: |
          python3 scripts/release_notes.py --migrations | while read -r old new; do
            if ! gh release view "$new" > /dev/null 2>&1; then
              if ! gh release view "$old" > /dev/null 2>&1; then echo "No release $old, skipped"; continue; fi
              sha=$(git rev-list -n 1 "$old")
              gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$new" -f sha="$sha" > /dev/null 2>&1 || true
              gh release edit "$old" --tag "$new"
              echo "Moved $old to $new"
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$old" > /dev/null; then
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$old"
              echo "Deleted old tag $old"
            fi
          done
      - name: Name APK files after their version
        run: |
          # Only the file name changes (AgenticOS.apk -> AgenticOS_vX.Y.Z.apk); the file itself stays the same.
          for tag in $(grep -oE '^## v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?(\+[0-9A-Za-z.]+)?' CHANGELOG.md | cut -c4-); do
            if ! gh release view "$tag" > /dev/null 2>&1; then continue; fi
            name=$(python3 scripts/release_notes.py --apk-name "$tag")
            for id in $(gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq '.assets[] | select(.name == "AgenticOS.apk") | .id'); do
              gh api -X PATCH "repos/${{ github.repository }}/releases/assets/$id" -f name="$name" > /dev/null
              echo "Renamed the APK of $tag to $name"
            done
          done
      - name: Update release titles and notes
        run: |
          for tag in $(grep -oE '^## v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?(\+[0-9A-Za-z.]+)?' CHANGELOG.md | cut -c4-); do
            if ! gh release view "$tag" > /dev/null 2>&1; then echo "No release $tag, skipped"; continue; fi
            python3 scripts/release_notes.py --tag "$tag" > notes.md
            gh release edit "$tag" --title "$tag – $(python3 scripts/release_notes.py --title "$tag")" --notes-file notes.md
            echo "Updated $tag"
          done
