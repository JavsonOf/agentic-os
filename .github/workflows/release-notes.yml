name: release-notes

# Gives every GitHub release its Polish/English name and writes the notes from CHANGELOG.md into the
# releases that have their own section there, so editing CHANGELOG.md on main also updates older releases.
on:
  push:
    branches: [main]
    paths: ["CHANGELOG.md", "scripts/release_notes.py", ".github/workflows/release-notes.yml"]
  workflow_dispatch:

permissions:
  contents: write  # edit release descriptions

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update release names and descriptions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every release gets the Polish/English name; releases with a CHANGELOG.md section also get its notes.
          for tag in $(gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -E '^android-[0-9]+$'); do
            n=${tag#android-}
            args=(--title "Agentic OS – wydanie $n · Release $n")
            if grep -qE "^## $tag( |$)" CHANGELOG.md; then
              python3 scripts/release_notes.py --tag "$tag" > notes.md
              args+=(--notes-file notes.md)
            fi
            gh release edit "$tag" "${args[@]}"
            echo "Updated $tag"
          done
